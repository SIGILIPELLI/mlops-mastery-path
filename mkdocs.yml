site_name: MLOps Mastery Path
site_description: A free MLOps course — experiment tracking, model registries, training pipelines, deployment, and monitoring for drift.
site_url: https://sigilipelli.github.io/mlops-mastery-path/
repo_url: https://github.com/sigilipelli/mlops-mastery-path
repo_name: mlops-mastery-path

theme:
  name: material
  favicon: assets/favicon.svg
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css
  - stylesheets/progress-tracker.css

extra_javascript:
  - javascripts/progress-tracker.js

nav:
  - Home: index.md
  - Privacy Policy: privacy.md
  - License: license.md
  - "Level 1 · Experiment Tracking & Reproducibility":
      - Overview: level-1/index.md
      - "01 · What MLOps Actually Solves: Notebook to Production": level-1/01-what-mlops-solves.md
      - "02 · Experiment Tracking Fundamentals: Runs, Params, Metrics": level-1/02-experiment-tracking-fundamentals.md
      - "03 · Logging Metrics & Artifacts During Training": level-1/03-logging-metrics-artifacts.md
      - "04 · Comparing Runs: Finding the Best Model Objectively": level-1/04-comparing-runs.md
      - "05 · Reproducibility: Seeds, Environments & Data Versions": level-1/05-reproducibility-seeds-environments.md
      - "06 · Tracking Data Lineage: Which Data Trained Which Model": level-1/06-data-lineage.md
      - "07 · Hyperparameter Sweeps: Tracking Many Runs at Once": level-1/07-hyperparameter-sweeps.md
      - "08 · Autologging: What It Captures and What It Misses": level-1/08-autologging.md
      - "09 · Tagging & Organizing Experiments at Scale": level-1/09-tagging-organizing-experiments.md
      - "10 · Project — Track a Real Training Run End to End": level-1/10-project-track-training-run.md
